version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: minierp-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mini_erp_db
      MYSQL_USER: erpuser
      MYSQL_PASSWORD: erppassword
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: minierp-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: erpuser
      DB_PASSWORD: erppassword
      DB_NAME: mini_erp_db
      JWT_SECRET: supersecret_jwt_key_mini_erp_2026
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:80
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: minierp-frontend
    restart: always
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  mysql_data:
